name: SMD Technologies Catalog Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Required Packages
        run: npm install axios firebase-admin

      - name: Execute SMD to Firestore Sync
        env:
          SMD_BEARER_TOKEN: ${{ secrets.SMD_BEARER_TOKEN }}
          SMD_CLIENT_KEY: ${{ secrets.SMD_CLIENT_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/sync.js
