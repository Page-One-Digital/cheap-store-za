name: Daily SMD Catalog Sync

on:
  schedule:
    # Runs automatically every day at 02:00 AM SAST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual button click from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SMD API Sync Script
        env:
          SMD_BEARER_TOKEN: ${{ secrets.SMD_BEARER_TOKEN }}
          SMD_CLIENT_KEY: ${{ secrets.SMD_CLIENT_KEY }}
        run: node scripts/sync-smd.js

      - name: Commit and Push Updated products.json
        run: |
          git config --global user.name "CHEAP Bot"
          git config --global user.email "bot@cheap-store.co.za"
          git add products.json
          git commit -m "auto: daily SMD catalog sync [skip ci]" || exit 0
          git push

      - name: Trigger GitHub Pages Build
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
